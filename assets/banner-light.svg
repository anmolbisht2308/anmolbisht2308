<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Anmol Bisht, Lead Full Stack Engineer">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d0d7de"/></pattern>
    <clipPath id="frame"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="#ffffff"/>
    <rect width="1280" height="360" fill="url(#dots)" opacity="0.6"/>
    <g filter="url(#blur)" opacity="0.45">
      <circle r="150" fill="#5eead4"><animate attributeName="cx" values="180;360;180" dur="18s" repeatCount="indefinite"/><animate attributeName="cy" values="80;220;80" dur="22s" repeatCount="indefinite"/></circle>
      <circle r="170" fill="#c4b5fd"><animate attributeName="cx" values="1080;880;1080" dur="20s" repeatCount="indefinite"/><animate attributeName="cy" values="300;120;300" dur="16s" repeatCount="indefinite"/></circle>
      <circle r="120" fill="#fcd34d"><animate attributeName="cx" values="620;760;620" dur="24s" repeatCount="indefinite"/><animate attributeName="cy" values="360;260;360" dur="19s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="0.5" y="0.5" width="1279" height="359" rx="20" fill="none" stroke="#d0d7de"/>
  </g>
  <text x="80" y="104" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="3" fill="#0f766e">LEAD FULL STACK ENGINEER · INFIHEAL</text>
  <text x="76" y="190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="78" font-weight="800" letter-spacing="-2" fill="#1f2328">Anmol Bisht</text>
  <text x="80" y="263" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="22" fill="#b45309">&gt;</text>
  <clipPath id="c0"><rect x="106" y="236" height="40" width="0">
    <animate attributeName="width" values="0;525;525;0;0" keyTimes="0;0.1200;0.2833;0.3133;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  <text x="106" y="263" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="22" fill="#1f2328" clip-path="url(#c0)">building real-time, AI-powered products</text>
  <rect x="106" y="242" width="11" height="26" fill="#0f766e" opacity="0">
