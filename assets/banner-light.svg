      <clipPath id="stream"><rect x="850" y="164" height="84" width="0">
        <animate attributeName="width" values="0;0;285;285;0" keyTimes="0;0.18;0.5;0.92;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
      <text y="190" font-size="16" fill="#1f2328" clip-path="url(#stream)"><tspan x="854" dy="0">Let&#x27;s slow down for a moment.</tspan><tspan x="854" dy="24">What&#x27;s weighing on you most</tspan><tspan x="854" dy="24">right now?</tspan></text>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#57606a" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.92;1" dur="12s" repeatCount="indefinite"/>
      <text x="840" y="284">data: {"done": true}</text>
      <text x="1190" y="284" text-anchor="end" fill="#0f766e">streamed in 1.2s</text>
    </g>
