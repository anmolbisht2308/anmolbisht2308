    <animate attributeName="opacity" values="1;1;1;0;0" keyTimes="0;0.1200;0.2833;0.3133;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
  <clipPath id="c1"><rect x="106" y="236" height="40" width="0">
    <animate attributeName="width" values="0;0;525;525;0;0" keyTimes="0;0.3333;0.4533;0.6167;0.6467;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  <text x="106" y="263" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="22" fill="#1f2328" clip-path="url(#c1)">leading the web &amp; app team behind Healo</text>
  <rect x="106" y="242" width="11" height="26" fill="#0f766e" opacity="0">
    <animate attributeName="x" values="106.0;106.0;631.0;631.0;106.0;106.0" keyTimes="0;0.3333;0.4533;0.6167;0.6467;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;0;0" keyTimes="0;0.3333;0.4533;0.6167;0.6467;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
  <clipPath id="c2"><rect x="106" y="236" height="40" width="0">
    <animate attributeName="width" values="0;0;551;551;0;0" keyTimes="0;0.6667;0.7867;0.9500;0.9800;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  <text x="106" y="263" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="22" fill="#1f2328" clip-path="url(#c2)">SSE · Socket.IO · LLM streaming · Next.js</text>
  <rect x="106" y="242" width="11" height="26" fill="#0f766e" opacity="0">
    <animate attributeName="x" values="106.0;106.0;657.0;657.0;106.0;106.0" keyTimes="0;0.6667;0.7867;0.9500;0.9800;1" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;1;0;0" keyTimes="0;0.6667;0.7867;0.9500;0.9800;1" dur="12s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
  <text x="80" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#57606a">Noida, India · real-time systems · AI products · engineering leadership</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="820" y="58" width="390" height="250" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
    <circle cx="844" cy="80" r="5" fill="#ff5f57"/><circle cx="862" cy="80" r="5" fill="#febc2e"/><circle cx="880" cy="80" r="5" fill="#28c840"/>
    <text x="1186" y="85" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" fill="#57606a">event-stream · live</text>
    <circle cx="1034" cy="81" r="4" fill="#0f766e"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="12s" repeatCount="indefinite"/>
